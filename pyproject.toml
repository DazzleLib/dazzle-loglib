[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dazzle-loglib"
description = "Channel/verbosity-aware CLI output management on dazzle-lib continua (OutputManager, VERBOSITY_CONTINUUM, channels, hints, trace)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "djdarcy", email = "djdarcy@users.noreply.github.com"},
]
keywords = ["dazzlelib", "logging", "verbosity", "channels", "cli", "diagnostics", "continuum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Logging",
]
dependencies = [
    "dazzle-lib>=0.8.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/DazzleLib/dazzle-loglib"
Repository = "https://github.com/DazzleLib/dazzle-loglib"
Issues = "https://github.com/DazzleLib/dazzle-loglib/issues"
Changelog = "https://github.com/DazzleLib/dazzle-loglib/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "dazzle_loglib._version.__version__"}

[tool.setuptools.packages.find]
include = ["dazzle_loglib*"]
